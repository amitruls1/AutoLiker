<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Date Liker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>

    <!-- Header -->
    <div class="header">
      <h1>Auto Date Liker</h1>
      <div class="subtitle">Smart auto-liker for dating apps</div>
    </div>

    <!-- Detected Site -->
    <div class="site-banner" id="siteBanner">
      <div class="dot" id="siteDot"></div>
      <div class="site-name" id="siteName">
        Navigate to a supported site to begin
      </div>
    </div>

    <!-- Platform Cards -->
    <div class="platforms">

      <!-- Tinder -->
      <div class="platform-card" data-platform="tinder">
        <div class="card-top">
          <div class="card-info">
            <div class="platform-icon tinder">T</div>
            <div>
              <div class="platform-label">Tinder</div>
              <div class="like-count">Likes: <span id="tinderCount">0</span></div>
            </div>
          </div>
          <button class="toggle-btn" data-platform="tinder" id="tinderToggle"
                  title="Start / Stop Tinder auto-like"></button>
        </div>
        <div class="speed-section">
          <div class="speed-header">
            <span class="speed-label">Speed</span>
            <span class="speed-value" id="tinderSpeedLabel">Normal</span>
          </div>
          <input type="range" class="speed-slider" id="tinderSpeed"
                 min="200" max="3000" value="1000" step="100" />
        </div>
      </div>

      <!-- Bumble -->
      <div class="platform-card" data-platform="bumble">
        <div class="card-top">
          <div class="card-info">
            <div class="platform-icon bumble">B</div>
            <div>
              <div class="platform-label">Bumble</div>
              <div class="like-count">Likes: <span id="bumbleCount">0</span></div>
            </div>
          </div>
          <button class="toggle-btn" data-platform="bumble" id="bumbleToggle"
                  title="Start / Stop Bumble auto-like"></button>
        </div>
        <div class="speed-section">
          <div class="speed-header">
            <span class="speed-label">Speed</span>
            <span class="speed-value" id="bumbleSpeedLabel">Normal</span>
          </div>
          <input type="range" class="speed-slider" id="bumbleSpeed"
                 min="200" max="3000" value="1000" step="100" />
        </div>
      </div>

      <!-- Happn -->
      <div class="platform-card" data-platform="happn">
        <div class="card-top">
          <div class="card-info">
            <div class="platform-icon happn">H</div>
            <div>
              <div class="platform-label">Happn</div>
              <div class="like-count">Likes: <span id="happnCount">0</span></div>
            </div>
          </div>
          <button class="toggle-btn" data-platform="happn" id="happnToggle"
                  title="Start / Stop Happn auto-like"></button>
        </div>
        <div class="speed-section">
          <div class="speed-header">
            <span class="speed-label">Speed</span>
            <span class="speed-value" id="happnSpeedLabel">Normal</span>
          </div>
          <input type="range" class="speed-slider" id="happnSpeed"
                 min="200" max="3000" value="1000" step="100" />
        </div>
      </div>

      <!-- OKCupid -->
      <div class="platform-card" data-platform="okcupid">
        <div class="card-top">
          <div class="card-info">
            <div class="platform-icon okcupid">O</div>
            <div>
              <div class="platform-label">OKCupid</div>
              <div class="like-count">Likes: <span id="okcupidCount">0</span></div>
            </div>
          </div>
          <button class="toggle-btn" data-platform="okcupid" id="okcupidToggle"
                  title="Start / Stop OKCupid auto-like"></button>
        </div>
        <div class="message-input">
          <label for="okcupidMsg">Pickup line (optional)</label>
          <input type="text" id="okcupidMsg"
                 placeholder="Leave blank for a random line" />
        </div>
        <div class="speed-section">
          <div class="speed-header">
            <span class="speed-label">Speed</span>
            <span class="speed-value" id="okcupidSpeedLabel">Normal</span>
          </div>
          <input type="range" class="speed-slider" id="okcupidSpeed"
                 min="1000" max="5000" value="2500" step="250" />
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-left">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Idle</span>
      </div>
      <span class="total-likes" id="totalLikes">0 total likes</span>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>Open the dating site first, then toggle a platform above.<br/>
      <a href="https://github.com/amitruls1/AutoLiker" target="_blank">GitHub</a></p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
